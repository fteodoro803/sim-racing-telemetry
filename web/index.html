<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <!-- Lets "Add to Home Screen" on an iPad open the page full-screen, without Safari's toolbars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sim Racing Telemetry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ===== Top bar: source, connection status, demo controls ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="back" id="backLink" href="../" hidden>← Back to Lab</a>
      <span class="brand">TELEMETRY</span>
      <button class="badge" id="sourceBadge" type="button" title="Change source">DEMO</button>
      <span class="dot muted" id="statusDot"></span>
      <span class="status" id="statusText" aria-live="polite"></span>
    </div>
    <div class="topbar-right">
      <div class="topbar-right" id="demoControls">
        <button class="btn" id="playBtn" type="button">Pause</button>
        <button class="btn" id="restartBtn" type="button">Restart</button>
        <label class="speed">Speed
          <select id="speedSel">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="5" selected>5×</option>
            <option value="10">10×</option>
          </select>
        </label>
      </div>
      <button class="btn" id="exportBtn" type="button" title="Save this session's laps to a file">Export</button>
      <button class="btn" id="importBtn" type="button" title="Load a saved session from a file">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <!-- ===== Widget grid (filled in by app.js from layout.js) ===== -->
  <main class="grid" id="grid"></main>

  <!-- ===== Message shown over the grid until the first live frame arrives ===== -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-title" id="overlayTitle"></div>
    <div class="overlay-text" id="overlayText"></div>
  </div>
</div>

<!-- ===== Setup panel: choose Demo or Live ===== -->
<div class="modal" id="setup" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="modal-head">
      <h2 id="setupTitle">Connect to game</h2>
      <button class="btn" id="setupClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabDemoBtn" type="button" role="tab" data-tab="demo">Demo</button>
      <button class="tab" id="tabLiveBtn" type="button" role="tab" data-tab="live">Live</button>
    </div>

    <div id="tabDemo">
      <p class="modal-text">Replays a simulated session, so you can try the page with no game and no bridge.</p>
      <button class="btn primary" id="useDemo" type="button">Use the demo</button>
    </div>

    <div id="tabLive" hidden>
      <label class="field">Bridge address
        <input id="address" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <p class="modal-hint" id="addressHint"></p>
      <ol class="steps">
        <li>Start the bridge on your computer</li>
        <li>Start GT7</li>
        <li>Connect</li>
      </ol>
      <div class="modal-actions">
        <button class="btn primary" id="connectBtn" type="button">Connect</button>
        <a class="link" id="bridgeLink" href="https://github.com/fteodoro803/sim-racing-telemetry/tree/main/bridge" target="_blank" rel="noopener">Download the bridge →</a>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
